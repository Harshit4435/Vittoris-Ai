name: Deploy VITTORIS AI Platform to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID || 'service_v70aene' }}
          VITE_EMAILJS_TEMPLATE_OWNER: ${{ secrets.VITE_EMAILJS_TEMPLATE_OWNER || 'template_7u7tez3' }}
          VITE_EMAILJS_TEMPLATE_CLIENT: ${{ secrets.VITE_EMAILJS_TEMPLATE_CLIENT || 'template_7u7tez3' }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY || 'd7kefRJyGh4blQyYw' }}
          VITE_COMPANY_EMAIL: ${{ secrets.VITE_COMPANY_EMAIL || 'company@vittoris.com' }}
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL || 'tharshit2257@gmail.com' }}
          VITE_CALENDLY_URL: ${{ secrets.VITE_CALENDLY_URL || 'https://calendly.com/tharshit2257/meetings' }}

      - name: Duplicate index.html to 404.html for SPA client-side routing
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
